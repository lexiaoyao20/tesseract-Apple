name: Auto build and release Tesseract

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 获取上游最新版本号
      - name: Fetch latest upstream Tesseract release
        id: latest
        run: |
          set -euo pipefail
          # 脚本内已包含防止 403 的 extraheader 修复
          version="$(python3 .github/scripts/get_latest_tess_version.py)"

          if [ -z "${version}" ]; then
            echo "Failed to detect latest Tesseract version from upstream tags" >&2
            exit 1
          fi

          echo "Detected latest upstream Tesseract version: ${version}"
          echo "LATEST_TESS_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 2. 检查该版本是否已处理过
      - name: Check if version tag already exists
        id: check
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "${LATEST_TESS_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${LATEST_TESS_VERSION} already exists. Process will stop."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 3. 安装编译依赖
      - name: Install Build Dependencies
        if: steps.check.outputs.exists == 'false'
        run: |
          brew install automake autoconf libtool pkg-config

      # 4. 第一轮更新：更新 build.sh/Package.swift 中的显示版本号
      - name: Update versions (Pre-build)
        if: steps.check.outputs.exists == 'false'
        env:
          LATEST_TESS_VERSION: ${{ env.LATEST_TESS_VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_versions.py

      # 5. 执行编译并打包产物
      - name: Build Tesseract (macOS + iOS + XCFramework)
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          chmod +x build.sh
          ./build.sh
          
          if [ ! -d "lib/Tesseract.xcframework" ]; then
            echo "Error: lib/Tesseract.xcframework not found after build."
            exit 1
          fi

          echo "Zipping artifact..."
          zip -r Tesseract.xcframework.zip lib/Tesseract.xcframework

      # 6. 第二轮更新：计算 Checksum 并将依赖指向刚生成的 Release Zip
      - name: Update Dependencies to Binary Release
        if: steps.check.outputs.exists == 'false'
        env:
          LATEST_TESS_VERSION: ${{ env.LATEST_TESS_VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          # 计算 SHA256
          CHECKSUM=$(swift package compute-checksum Tesseract.xcframework.zip)
          echo "Computed checksum: $CHECKSUM"
          
          # 调用脚本更新 Package.swift (url/checksum)
          python3 .github/scripts/update_versions.py --checksum "$CHECKSUM"

      # 7. 提交配置文件更新 (Package.swift 等指向新 Release)
      - name: Commit updated config files
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add build.sh \
                  Package.swift \
                  .github/scripts/update_versions.py \
                  .github/workflows/auto-build-tesseract.yml \
                  .gitignore
          
          if git diff --cached --quiet; then
            echo "No config changes to commit."
            # 如果没有产生新 commit，则使用当前 SHA
            echo "RELEASE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          else
            git commit -m "chore: update to Tesseract ${LATEST_TESS_VERSION} [skip ci]"
            git pull --rebase origin HEAD
            git push origin HEAD
            
            # 【关键修改】获取最新的 Commit SHA，因为 Release Tag 必须包含最新的 Package.swift
            NEW_SHA=$(git rev-parse HEAD)
            echo "Latest commit SHA is $NEW_SHA"
            echo "RELEASE_SHA=$NEW_SHA" >> "$GITHUB_ENV"
          fi

      # 8. 创建 GitHub Release 并上传 Zip 包
      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          # 【关键修改】使用 --target 指向我们在 Step 7 中刚刚 Push 的最新 Commit
          gh release create "${LATEST_TESS_VERSION}" \
            Tesseract.xcframework.zip \
            --title "Tesseract ${LATEST_TESS_VERSION}" \
            --notes "Automated build for upstream Tesseract ${LATEST_TESS_VERSION}." \
            --target "${RELEASE_SHA}"
